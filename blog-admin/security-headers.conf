# ========================================
# 安全响应头片段（被 nginx.conf 各 location include）
# ========================================
#
# nginx 的 add_header 继承规则：location 块一旦出现自己的 add_header，
# 就会整体覆盖 server 块的 add_header，导致安全头丢失。因此本片段被显式
# include 到每个需要下发安全头的 location 中。

# 防止点击劫持（frame/iframe 嵌入）
add_header X-Frame-Options "SAMEORIGIN" always;
# 防止 MIME 类型嗅探
add_header X-Content-Type-Options "nosniff" always;
# Referrer 策略（收紧为仅同源泄露 origin）
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# 权限策略：禁用敏感设备能力
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# 内容安全策略（CSP）
# 注意：已移除废弃的 X-XSS-Protection（现代浏览器已弃用且可被绕过），改用 CSP。
#
# 当前为「宽松起步」策略，确保 antd/vditor/wangeditor 的内联样式、WebSocket、
# 同源 API 与上传资源可用。生产前建议：
#   1) 启用 report-uri / Report-To 收集违规，逐步收紧；
#   2) 将 style/img/connect 的通配域名收敛到实际使用的固定域名；
#   3) style-src 的 'unsafe-inline' 改为 nonce/hash；
#   4) connect-src 的 ws:/wss: 收敛到具体主机。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:; media-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
