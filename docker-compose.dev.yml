# ========================================
# 开发环境服务（基础依赖 + 后端服务）
# 包含 MySQL、Redis、RabbitMQ、blog-service
# Elasticsearch 通过 elasticsearch profile 可选启用
# ========================================

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: blog-mysql-dev
    restart: unless-stopped
    ports:
      - "${DB_HOST_BIND:-127.0.0.1}:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root_password}
      MYSQL_DATABASE: ${DB_NAME:-blog}
      MYSQL_USER: ${DB_USER:-blog}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me_db_password}
    volumes:
      - mysql_dev_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone='+08:00'
      --performance-schema=off
      --innodb-buffer-pool-size=64M
      --max-connections=20
    networks:
      - blog-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis缓存
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: blog-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_PUBLISHED_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_dev_data:/data
    networks:
      - blog-dev-network
    # 限制容器内存（宿主机保护）
    mem_limit: 96m

    # 同时限制 Redis 自己可用内存（避免 Redis 顶满容器导致 OOM）
    command: >
      sh -c "
        EXTRA_ARGS='--maxmemory 64mb --maxmemory-policy allkeys-lru';
        if [ -n \"$$REDIS_PASSWORD\" ]; then
          redis-server --requirepass \"$$REDIS_PASSWORD\" $$EXTRA_ARGS;
        else
          redis-server $$EXTRA_ARGS;
        fi
      "
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RabbitMQ消息队列
  rabbitmq:
    build:
      context: ./docker/rabbitmq
      dockerfile: Dockerfile
    image: swater-rabbitmq:3-management-alpine
    container_name: blog-rabbitmq-dev
    restart: unless-stopped
    ports:
      - "${RABBITMQ_HOST_BIND:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"    # AMQP端口
      - "${RABBITMQ_HOST_BIND:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PUBLISHED_PORT:-15672}:15672"  # 管理界面端口
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change_me_rabbitmq_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_dev_data:/var/lib/rabbitmq
    networks:
      - blog-dev-network
    # 限制容器内存（宿主机保护）
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 后端服务
  blog-service:
    build:
      context: ./blog-service
      dockerfile: Dockerfile
    container_name: blog-service-dev
    restart: unless-stopped
    ports:
      - "${BLOG_SERVICE_HOST_BIND:-127.0.0.1}:${BLOG_SERVICE_PUBLISHED_PORT:-8888}:${SERVER_PORT:-8888}"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-blog}
      DB_USER: ${DB_USER:-blog}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_db_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change_me_rabbitmq_password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      SERVER_PORT: ${SERVER_PORT:-8888}
      BLOG_SITE_URL: ${BLOG_SITE_URL:-http://127.0.0.1:3001}
      # 开发环境关闭 CSRF 同源校验：dev 拓扑为 浏览器(3001) → vite proxy → 后端(8888)，
      # proxy 转发的 Origin/Referer 与后端 Host 不匹配，会被生产 CSRF 策略误判为跨站攻击
      # 而返回 400（如登录 POST /api/auth/login）。生产部署（docker-compose.yml）保持开启。
      SECURITY_CSRF_ENABLED: ${SECURITY_CSRF_ENABLED:-false}
      # 开发环境关闭全局限流：vite proxy 默认不转发 X-Forwarded-For，所有浏览器请求
      # 落到同一个 getRemoteAddr()（docker 网桥 IP）共享限流桶，后台页面的列表/下拉/轮询
      # 很容易在 1 分钟内打满生产阈值(ip-per-minute)而触发 429。生产部署保持开启。
      SECURITY_RATE_LIMIT_ENABLED: ${SECURITY_RATE_LIMIT_ENABLED:-false}
      BLOG_RSS_DEFAULT_LOCALE: ${BLOG_RSS_DEFAULT_LOCALE:-zh}
      # Elasticsearch 配置（默认走 database 搜索插件，启用 ES 时设 PLUGIN_SEARCH_ACTIVE=elasticsearch）
      PLUGIN_SEARCH_ACTIVE: ${PLUGIN_SEARCH_ACTIVE:-database}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-http://localhost:9200}
      ELASTICSEARCH_REPOSITORIES_ENABLED: ${ELASTICSEARCH_REPOSITORIES_ENABLED:-false}
      ELASTICSEARCH_HEALTH_ENABLED: ${ELASTICSEARCH_HEALTH_ENABLED:-false}
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      # 邮件
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # 安全密钥
      SA_TOKEN_JWT_SECRET_KEY: ${SA_TOKEN_JWT_SECRET_KEY:-}
      AUTH_EMAIL_SESSION_SECRET: ${AUTH_EMAIL_SESSION_SECRET:-}
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:-}
      SECURITY_TRUSTED_PROXIES: ${SECURITY_TRUSTED_PROXIES:-}
      SECURITY_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${SECURITY_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      SA_TOKEN_COOKIE_SECURE: ${SA_TOKEN_COOKIE_SECURE:-false}
      # 第三方服务
      AMAP_KEY: ${AMAP_KEY:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - blog_logs_dev:/app/logs
      - blog_uploads_dev:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - blog-dev-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || curl -fs http://localhost:$${SERVER_PORT:-8888}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Elasticsearch搜索引擎（可选，通过 elasticsearch profile 启用）
  # 启用方式：docker compose -f docker-compose.dev.yml --profile elasticsearch up -d elasticsearch
  # 应用侧需同时设置 PLUGIN_SEARCH_ACTIVE=elasticsearch 才会真正使用
  elasticsearch:
    build:
      context: ./docker/elasticsearch
      dockerfile: Dockerfile
    image: swater-elasticsearch:8.11.0-ik
    container_name: blog-elasticsearch-dev
    restart: unless-stopped
    profiles:
      - elasticsearch
    ports:
      - "${ELASTICSEARCH_HOST_BIND:-127.0.0.1}:${ELASTICSEARCH_HTTP_PUBLISHED_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_dev_data:/usr/share/elasticsearch/data
    networks:
      - blog-dev-network
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 数据卷
volumes:
  mysql_dev_data:
  redis_dev_data:
  rabbitmq_dev_data:
  blog_logs_dev:
  blog_uploads_dev:
  elasticsearch_dev_data:

# 网络
networks:
  blog-dev-network:
    driver: bridge
