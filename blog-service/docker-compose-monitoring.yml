services:
  # Prometheus - 指标收集
  # 依赖外部主栈网络（swater-blog_blog-network，可用 BLOG_NETWORK_NAME 覆盖），
  # 直接抓取容器网络内的 swater-blog-service:8888/actuator/prometheus
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: blog-prometheus
    ports:
      - "${PROMETHEUS_HOST_BIND:-127.0.0.1}:${PROMETHEUS_PUBLISHED_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - monitoring
      - blog-network
    restart: unless-stopped

  # Grafana - 监控面板
  grafana:
    image: grafana/grafana:11.3.0
    container_name: blog-grafana
    ports:
      - "${GRAFANA_HOST_BIND:-127.0.0.1}:${GRAFANA_PUBLISHED_PORT:-3000}:3000"
    environment:
      # 必填：不设置时 Grafana 会使用默认 admin/admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus

  # AlertManager - 告警管理
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: blog-alertmanager
    ports:
      - "${ALERTMANAGER_HOST_BIND:-127.0.0.1}:${ALERTMANAGER_PUBLISHED_PORT:-9093}:9093"
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com:587}
      SMTP_FROM: ${SMTP_FROM:-blog-alerts@yourdomain.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-admin@yourdomain.com}
      ALERT_EMAIL_CRITICAL: ${ALERT_EMAIL_CRITICAL:-admin@yourdomain.com}
      ALERT_EMAIL_WARNING: ${ALERT_EMAIL_WARNING:-admin@yourdomain.com}
    volumes:
      - ./monitoring/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - alertmanager_data:/alertmanager
    entrypoint:
      - /bin/sh
      - -c
      - |
        envsubst < /etc/alertmanager/alertmanager.yml.template > /etc/alertmanager/alertmanager.yml
        exec alertmanager \
          --config.file=/etc/alertmanager/alertmanager.yml \
          --storage.path=/alertmanager \
          --web.external-url=${ALERTMANAGER_EXTERNAL_URL:-http://localhost:9093}
    networks:
      - monitoring
    restart: unless-stopped

  # Node Exporter - 系统指标
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: blog-node-exporter
    ports:
      - "${NODE_EXPORTER_HOST_BIND:-127.0.0.1}:${NODE_EXPORTER_PUBLISHED_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring
    restart: unless-stopped

  # MySQL Exporter - MySQL指标（连主栈的 mysql）
  mysql-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: blog-mysql-exporter
    ports:
      - "${MYSQL_EXPORTER_HOST_BIND:-127.0.0.1}:${MYSQL_EXPORTER_PUBLISHED_PORT:-9104}:9104"
    environment:
      # 生产环境建议创建只读监控用户: CREATE USER 'monitor'@'%' IDENTIFIED BY 'xxx'; GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* TO 'monitor'@'%';
      # 然后设置 MYSQL_EXPORTER_USER=monitor
      - DATA_SOURCE_NAME=${MYSQL_EXPORTER_USER:-root}:${MYSQL_EXPORTER_PASSWORD:-${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}}@(mysql:3306)/${DB_NAME:-blog}
    networks:
      - blog-network
    restart: unless-stopped

  # Redis Exporter - Redis指标（连主栈的 redis）
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: blog-redis-exporter
    ports:
      - "${REDIS_EXPORTER_HOST_BIND:-127.0.0.1}:${REDIS_EXPORTER_PUBLISHED_PORT:-9121}:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    networks:
      - blog-network
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  monitoring:
    driver: bridge
  # 主栈（docker-compose.yml）创建的业务网络；exporters/prometheus 借此直连 mysql/redis/blog-service
  blog-network:
    name: ${BLOG_NETWORK_NAME:-swater-blog_blog-network}
    external: true
