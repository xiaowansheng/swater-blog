# ========================================
# Docker 环境配置
# 仅包含与 application.yml 不同的覆盖配置
# ========================================

server:
  port: ${SERVER_PORT:8888}

blog:
  site-url: ${BLOG_SITE_URL:http://localhost}
  rss:
    default-locale: ${BLOG_RSS_DEFAULT_LOCALE:zh}
  bootstrap:
    admin:
      username: admin
      password: change_me_admin_password
      email: admin@example.com

spring:
  application:
    name: blog-docker

  tomcat:
    threads:
      max: 100
      min-spare: 10
    connection-timeout: 20000
    max-connections: 500
    accept-count: 100
    accesslog:
      enabled: true
      directory: /app/logs
      pattern: '%h %l %u %t "%r" %s %b %D'
      file-date-format: .yyyy-MM-dd
      prefix: access_log
      suffix: .log

  thymeleaf:
    cache: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:blog}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:blog}
    password: ${DB_PASSWORD:change_me_db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        dialect: org.hibernate.dialect.MySQL8Dialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # schema.sql 含幂等 ALTER TABLE 补列语句，首次执行成功后重复执行会报
      # Duplicate column 错误，需容忍以保证镜像可重复启动。
      continue-on-error: true
      separator: ";"
      encoding: utf-8

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
        shutdown-timeout: 100ms
    elasticsearch:
      repositories:
        enabled: ${ELASTICSEARCH_REPOSITORIES_ENABLED:false}

  elasticsearch:
    uris: ${ELASTICSEARCH_HOST:http://elasticsearch:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:change_me_rabbitmq_password}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 2
        max-concurrency: 5

  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from-name: Swater Blog
    properties:
      mail:
        smtp:
          ssl:
            enable: true

file:
  storage:
    local:
      path: /app/uploads

location:
  amap:
    key: ${AMAP_KEY:}

revalidate:
  url: http://blog-web:3000
  token: ${REVALIDATE_TOKEN:change-me}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

sa-token:
  is-log: false

logging:
  level:
    root: INFO
    com.blog: INFO
    org.springframework.web: WARN
    org.mybatis: WARN
    com.zaxxer.hikari: WARN
    org.springframework.security: WARN
    org.springframework.transaction: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    path: /app/logs
    name: /app/logs/application.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 3GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    metrics:
      enabled: true
    prometheus:
      enabled: true
    shutdown:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  health:
    redis:
      enabled: true
    elasticsearch:
      enabled: ${ELASTICSEARCH_HEALTH_ENABLED:false}
    db:
      enabled: true
    rabbit:
      enabled: true
    mail:
      enabled: false
    diskspace:
      enabled: true
      threshold: 1GB

security:
  # CSRF 同源校验：生产环境强制开启
  csrf:
    enabled: true
  rate-limit:
    enabled: true
    default-window: 60
    default-limit: 200
    ip-per-second: 20
    ip-per-minute: 1200
    message: "请求过于频繁，请稍后再试"
    whitelist:
      - /favicon.ico
      - /uploads/**
      - /static/**
      - /public/**
      - /webjars/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /swagger-**
      - /v3/api-docs/**
      - /actuator/**
      - /**/*.css
      - /**/*.js
      - /**/*.map
      - /**/*.png
      - /**/*.jpg
      - /**/*.jpeg
      - /**/*.gif
      - /**/*.svg
      - /**/*.ico
      - /**/*.woff
      - /**/*.woff2
      - /**/*.ttf
  sql-injection:
    enabled: true
    log-attacks: true
  xss-protection:
    enabled: true
    sanitize-input: true
  file-upload:
    max-size: 10MB
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - webp
      - svg
      - ico
      - pdf
      - doc
      - docx
    blocked-extensions:
      - exe
      - bat
      - cmd
      - sh
      - jsp
      - php
  ip-blacklist:
    enabled: false
    ips: []
  data-masking:
    enabled: true
    log-sensitive-data: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    doc-expansion: none
  show-actuator: false

app:
  cors:
    # Docker 部署默认通过 nginx 反代同源，无需 CORS；
    # 若分离部署（admin/web 直连 blog-service），设置 APP_CORS_ENABLED=true 并配置 allowed-origins
    enabled: ${APP_CORS_ENABLED:false}
    allowed-origins:
      - ${APP_CORS_ALLOWED_ORIGIN:https://blog.example.com}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Verify-Token
      - X-Requested-With
    exposed-headers:
      - Content-Disposition
      - Content-Type
      - Content-Length
    allow-credentials: true
