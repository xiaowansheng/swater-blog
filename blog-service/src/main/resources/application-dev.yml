# ========================================
# 开发环境配置
# 仅包含与 application.yml 不同的覆盖配置
# ========================================

server:
  port: ${SERVER_PORT:8888}

blog:
  site-url: ${BLOG_SITE_URL:http://127.0.0.1:3001}
  rss:
    default-locale: ${BLOG_RSS_DEFAULT_LOCALE:zh}
  # 初始管理员账号：本地启动前必须通过环境变量提供，缺失则启动失败（fail-fast）
  # export BLOG_ADMIN_USERNAME=admin BLOG_ADMIN_PASSWORD=xxx BLOG_ADMIN_EMAIL=a@b.com
  bootstrap:
    admin:
      username: ${BLOG_ADMIN_USERNAME:}
      password: ${BLOG_ADMIN_PASSWORD:}
      email: ${BLOG_ADMIN_EMAIL:}

spring:
  application:
    name: blog-dev

  mvc:
    servlet:
      path: /

  tomcat:
    threads:
      max: 50
      min-spare: 5
    connection-timeout: 20000
    max-connections: 200
    accept-count: 50
    accesslog:
      enabled: true
      directory: logs
      pattern: '%h %l %u %t "%r" %s %b %D'
      file-date-format: .yyyy-MM-dd
      prefix: access_log
      suffix: .log

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:blog}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:blog}
    password: ${DB_PASSWORD:change_me_db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data-dev.sql
      continue-on-error: true
      separator: ";"
      encoding: utf-8

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms
        shutdown-timeout: 100ms
    elasticsearch:
      repositories:
        enabled: ${ELASTICSEARCH_REPOSITORIES_ENABLED:false}

  elasticsearch:
    uris: ${ELASTICSEARCH_HOST:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:change_me_rabbitmq_password}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 1
        max-concurrency: 3

  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from-name: Swater Blog Dev

  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: static/**,public/**
    livereload:
      enabled: true
      port: 35729
    add-properties: true

file:
  storage:
    local:
      path: uploads

location:
  amap:
    key: ${AMAP_KEY:your-amap-key}

revalidate:
  url: http://127.0.0.1:3001
  token: ${REVALIDATE_TOKEN:change-me}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  is-log: true

logging:
  level:
    root: INFO
    com.blog: DEBUG
    org.springframework.web: INFO
    org.mybatis: DEBUG
    com.zaxxer.hikari: INFO
    org.springframework.security: DEBUG
    org.springframework.transaction: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    path: logs
    name: logs/application-dev.log

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: '*'
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
    shutdown:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}
  health:
    redis:
      enabled: true
    db:
      enabled: true
    rabbit:
      enabled: true
    mail:
      enabled: false
    elasticsearch:
      enabled: ${ELASTICSEARCH_HEALTH_ENABLED:false}
    diskspace:
      enabled: true
      threshold: 1GB

security:
  rate-limit:
    enabled: false
    default-window: 60
    default-limit: 2000
    ip-per-second: 50
    ip-per-minute: 3000
    message: "请求过于频繁，请稍后再试"
    whitelist:
      - /favicon.ico
      - /uploads/**
      - /static/**
      - /public/**
      - /webjars/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /swagger-**
      - /v3/api-docs/**
      - /actuator/**
      - /**/*.css
      - /**/*.js
      - /**/*.map
      - /**/*.png
      - /**/*.jpg
      - /**/*.jpeg
      - /**/*.gif
      - /**/*.svg
      - /**/*.ico
      - /**/*.woff
      - /**/*.woff2
      - /**/*.ttf
  sql-injection:
    enabled: true
    log-attacks: true
  xss-protection:
    enabled: true
    sanitize-input: true
  file-upload:
    max-size: 50MB
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - gif
      - pdf
      - doc
      - docx
      - txt
      - md
    blocked-extensions:
      - exe
      - bat
      - cmd
      - sh
      - jsp
      - php
  ip-blacklist:
    enabled: false
    ips: []
  data-masking:
    enabled: false

springdoc:
  swagger-ui:
    default-models-expand-depth: 2
    default-model-expand-depth: 2
    doc-expansion: list

# ========================================
# 开发环境专用配置（dev profile only）
# ========================================
dev:
  hot-reload:
    enabled: true
    watch-paths:
      - src/main/java
      - src/main/resources
  debug:
    sql-log: true
    request-log: true
    response-log: true
    performance-log: true
  mock:
    enabled: true
    users: 100
    articles: 500
    comments: 1000
  tools:
    h2-console: true
    swagger-ui: true
    actuator: true
    devtools: true

app:
  cors:
    enabled: true
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
      - http://localhost:3002
      - http://localhost:8888
      - http://127.0.0.1:3000
      - http://127.0.0.1:3001
      - http://127.0.0.1:3002
      - http://127.0.0.1:8888
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Verify-Token
      - X-Requested-With
    exposed-headers:
      - Content-Disposition
      - Content-Type
      - Content-Length
    allow-credentials: true
