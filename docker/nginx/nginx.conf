user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 字符集配置
    charset utf-8;
    charset_types text/xml text/plain text/css application/javascript application/json application/rss+xml;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip 压缩（HTML/文本类资源）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/rss+xml image/svg+xml;

    # 基础安全响应头（子级 location 有自己的 add_header 时不会继承，站点级头在 conf.d 中按需补充）
    # 注：X-Frame-Options/CSP 放在 http 层会被 location 内 add_header 取代，故这里只放不会冲突的
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}